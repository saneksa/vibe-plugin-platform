<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clock</title>
    <style>
      /* 1.2.0: the previous generation. Same palette as 2.0.0, plainly laid
         out and without the date panel, so a live upgrade is visible by eye. */
      :root {
        color-scheme: dark;
        --surface: #14161c;
        --card: #1b1e26;
        --line: #262a33;
        --text: #e6e8ec;
        --muted: #9aa1ad;
        --faint: #6f7684;
        --accent: #818cf8;
        --accent-soft: rgba(129, 140, 248, 0.22);
        --success: #34d399;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --surface: #ffffff;
        --card: #f6f7f9;
        --line: #e4e7ec;
        --text: #111827;
        --muted: #6b7280;
        --faint: #9ca3af;
        --accent: #4f46e5;
        --accent-soft: rgba(79, 70, 229, 0.14);
        --success: #059669;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        box-sizing: border-box;
        padding: 16px;
      }
      /* Size container: the digits scale with the tile, not with the window. */
      .clock {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        height: 100%;
        container-type: size;
      }
      .clock-version {
        align-self: flex-start;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font: 600 11px/1.2 var(--mono);
      }
      .clock-time {
        font-size: clamp(28px, min(12cqw, 13cqh), 64px);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .clock-mode {
        color: var(--muted);
        font: 11px/1.2 var(--mono);
      }
      .clock input {
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
      }
      .clock input::placeholder {
        color: var(--faint);
      }
      .clock input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .clock-saved {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .clock-saved:not(:empty) {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
