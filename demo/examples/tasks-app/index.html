<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <style>
      /* The host reports its theme through the SDK; main.tsx mirrors it on <html>. */
      :root {
        color-scheme: dark;
        --surface: #14161c;
        --card: #1b1e26;
        --line: #262a33;
        --text: #e6e8ec;
        --muted: #9aa1ad;
        --faint: #6f7684;
        --accent: #6366f1;
        --accent-hover: #7679f3;
        --accent-soft: rgba(129, 140, 248, 0.22);
        --danger: #f87171;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --surface: #ffffff;
        --card: #f6f7f9;
        --line: #e4e7ec;
        --text: #111827;
        --muted: #6b7280;
        --faint: #9ca3af;
        --accent: #4f46e5;
        --accent-hover: #6366f1;
        --accent-soft: rgba(79, 70, 229, 0.14);
        --danger: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .tasks-app {
        height: 100vh;
      }
      /* The shell fills the SDK root: sidebar + main column. */
      .app-shell {
        display: flex;
        height: 100vh;
        width: 100%;
      }
      .app-loading {
        padding: 24px;
        color: var(--muted);
      }

      /* Sidebar */
      .app-side {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 200px;
        padding: 16px 12px;
        border-right: 1px solid var(--line);
        background: var(--card);
      }
      .app-brand {
        margin: 0 8px 14px;
        font-size: 15px;
        font-weight: 700;
      }
      .app-nav a {
        display: block;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--muted);
        font-weight: 500;
      }
      .app-nav a:hover {
        background: var(--surface);
        color: var(--text);
      }
      .app-nav a.is-active {
        background: var(--surface);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      /* Main column */
      .app-main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .app-top {
        display: flex;
        flex: none;
        align-items: center;
        height: 52px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
      }
      .app-route {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font: 12px/1.3 var(--mono);
      }
      .app-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 28px 32px 48px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 600;
      }
      .hint {
        color: var(--muted);
      }
      .hint a {
        color: var(--accent);
      }
      code {
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        font: 12px/1.4 var(--mono);
      }

      /* Cards */
      .card-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .card {
        flex: none;
        min-width: 140px;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .card-value {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
      }
      .card-label {
        color: var(--muted);
        font-size: 12px;
      }
      .card-note {
        margin-top: 4px;
        color: var(--accent);
        font: 11px/1.4 var(--mono);
      }

      /* Filters */
      .chip-row {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .chip:hover {
        color: var(--text);
      }
      .chip.is-active {
        border-color: transparent;
        background: var(--accent);
        color: #ffffff;
      }
      .chip-mono {
        font: 11px/1.3 var(--mono);
      }

      /* Task rows */
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
      }
      .task-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      .task-row .task-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .task-row .task-title:hover {
        color: var(--accent);
      }
      .task-row.is-done .task-title {
        color: var(--faint);
        text-decoration: line-through;
      }
      .task-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      /* Forms and buttons */
      .task-form {
        display: flex;
        gap: 8px;
        max-width: 480px;
      }
      .task-form input {
        flex: 1 1 auto;
        min-width: 0;
        height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
      }
      .task-form input::placeholder {
        color: var(--faint);
      }
      .task-form input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn {
        height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:focus-visible,
      .task-form input:focus-visible,
      a:focus-visible,
      input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn-danger {
        border-color: var(--line);
        background: transparent;
        color: var(--danger);
        font-weight: 500;
      }
      .btn-danger:hover {
        background: var(--card);
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }

      /* Definition lists (task detail, about) */
      .meta {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 8px 16px;
        max-width: 480px;
        margin: 0 0 24px;
      }
      .meta dt {
        color: var(--faint);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .meta dd {
        margin: 0;
      }
      .meta dd a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
