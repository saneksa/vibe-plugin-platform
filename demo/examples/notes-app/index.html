<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      /* The host reports its theme through the SDK; main.ts mirrors it on <html>. */
      :root {
        color-scheme: dark;
        --surface: #14161c;
        --card: #1b1e26;
        --line: #262a33;
        --text: #e6e8ec;
        --muted: #9aa1ad;
        --faint: #6f7684;
        --accent: #6366f1;
        --accent-hover: #7679f3;
        --accent-soft: rgba(129, 140, 248, 0.22);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --surface: #ffffff;
        --card: #f6f7f9;
        --line: #e4e7ec;
        --text: #111827;
        --muted: #6b7280;
        --faint: #9ca3af;
        --accent: #4f46e5;
        --accent-hover: #6366f1;
        --accent-soft: rgba(79, 70, 229, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      .notes-app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .notes-bar {
        display: flex;
        flex: none;
        align-items: center;
        gap: 24px;
        height: 56px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .notes-app h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .notes-app nav {
        display: flex;
        gap: 4px;
      }
      .notes-app nav button {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-weight: 500;
        cursor: pointer;
      }
      .notes-app nav button:hover {
        background: var(--surface);
        color: var(--text);
      }
      .notes-app nav button[aria-current="page"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      /* The route pattern the SDK matched, as a quiet reminder of the routing. */
      .notes-route {
        margin-left: auto;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font: 12px/1.3 var(--mono);
      }
      .notes-app > main {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }
      .notes-form {
        display: flex;
        gap: 8px;
      }
      .notes-form input {
        flex: 1 1 auto;
        min-width: 0;
        height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
      }
      .notes-form input::placeholder {
        color: var(--faint);
      }
      .notes-form input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn {
        height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:focus-visible,
      .notes-app nav button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn-ghost {
        border-color: var(--line);
        background: transparent;
        color: var(--text);
        font-weight: 500;
      }
      .btn-ghost:hover {
        background: var(--card);
        color: var(--text);
      }
      .notes-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }
      .notes-list li {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .notes-list li.is-empty {
        border-style: dashed;
        color: var(--muted);
        text-align: center;
      }
      .notes-setting {
        margin: 0;
        padding: 20px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
